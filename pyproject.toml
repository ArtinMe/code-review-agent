[project]
name = "codereview-ai"
version = "2.0.0"
description = "Multi-agent code review with line-anchored, verified findings."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "flask>=3.0",
    "google-genai>=1.0",
    "gunicorn>=22.0",
    "pydantic>=2.6",
    "python-dotenv>=1.0",
]

[project.scripts]
codereview = "codereview.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["codereview"]

[tool.ruff]
line-length = 100
target-version = "py311"
# evaluation cases contain deliberate bugs
extend-exclude = ["evals/cases"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
